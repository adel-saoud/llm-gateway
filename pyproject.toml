[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "Open-source LLM gateway with RAG-aware cost attribution: runs fully locally with Ollama."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Adel Saoud" }]
keywords = ["llm", "gateway", "rag", "cost-attribution", "ollama", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.47",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "httpx>=0.28",
    "redis[hiredis]>=7.4",
    "aiosqlite>=0.22",
    "pyyaml>=6.0",
    "structlog>=25.5",
    "prometheus-client>=0.25",
    "opentelemetry-sdk>=1.42",
    "opentelemetry-api>=1.42",
    "opentelemetry-exporter-otlp-proto-http>=1.42",
    "numpy>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.1",
    "pytest-mock>=3.15",
    "respx>=0.23",
    "fakeredis[lua]>=2.30",
    "ruff>=0.17.2",
    "pyright>=1.1.414",
    "pre-commit>=4.6",
    "rich>=15.0",
    "jsonschema>=4.25",
    "commitizen>=4.19.3,<5",
]

[project.urls]
Homepage = "https://github.com/adel-saoud/llm-gateway"
Repository = "https://github.com/adel-saoud/llm-gateway"
Issues = "https://github.com/adel-saoud/llm-gateway/issues"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_files = ["src/llm_gateway/__init__.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = false
major_version_zero = true

# ── Ruff: lint + format ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # bugbear
    "C4",         # comprehensions
    "UP",         # pyupgrade
    "SIM",        # simplify
    "RUF",        # ruff-specific
    "N",          # pep8-naming
    "ANN",        # type annotations
    "S",          # flake8-bandit port (security)
    "PT",         # pytest style
    "TID",        # tidy imports
    "PL",         # pylint
    "TRY",        # tryceratops
]
ignore = [
    "ANN401",  # allow Any in narrow cases (e.g. **kwargs passthrough)
    "PLR0912", # too many branches: readable in routing/tagger code
    "PLR0913", # too many arguments: fine for FastAPI handlers
    "PLR0915", # too many statements: same
    "PLR2004", # magic value comparisons: readable in context
    "PLC0415", # local imports: used intentionally for lazy/optional imports
    "PLW0108", # unnecessary lambda: pydantic Field default_factory needs callables
    "TRY003",  # long exception messages are fine
    "TRY004",  # ValueError vs TypeError: domain choice, ValueError is fine
    "TRY301",  # abstract raise to inner func: overkill for inline patterns
    "RUF001",  # ambiguous unicode in strings: intentional (en dashes etc)
    "RUF002",  # ambiguous unicode in docstrings: intentional
    "RUF003",  # ambiguous unicode in comments: intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PLR0917", "PLR2004", "S101", "S105", "S106", "S311"]
"scripts/**/*.py" = ["ANN", "S311", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ── Pyright: strict type checking ───────────────────────────────────────────
[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=llm_gateway",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests using mock Ollama (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["src/llm_gateway"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 90
